name: campus_navigator
description: "RouteSee is a modern campus navigation app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Map & Location
  google_maps_flutter: ^2.4.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Icon
  flutter_launcher_icons: ^0.14.4

  # HTTP & API
  http: ^1.2.2

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Storage
  shared_preferences: ^2.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/png/app_icon.png"

dependency_overrides:
  flutter_inappwebview_android:
    git:
      url: https://github.com/holzgeist/flutter_inappwebview
      path: flutter_inappwebview_android
      ref: d89b1d32638b49dfc58c4b7c84153be0c269d057

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/png/app_icon.png

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
